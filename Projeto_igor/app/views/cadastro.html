
{% extends 'base.html' %}

{% block title %}Cadastro{% endblock %}

{% block content %}

<h2>Criar conta</h2>

<form method="POST">

    <label>Usuário:</label>
    <input type="text" name="username" required>

    <label>Senha:</label>
    <input type="password" name="senha" required>

    <button type="submit">Cadastrar</button>

</form>

<a href="{{ url_for('auth.login') }}">Voltar ao login</a>

{% endblock %}
